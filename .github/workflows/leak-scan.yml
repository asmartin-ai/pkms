name: leak-scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Scan every commit
        run: gitleaks git --redact --no-banner .

  personal-paths:
    name: personal path patterns
    if: github.repository == 'asmartin-ai/pkms'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERSONAL_PATH_RE: '(^|[^A-Za-z0-9_./-])/path/to/local-resource)\.'
      PERSONAL_PATH_EXCLUDE: :(exclude).github/workflows/leak-scan.yml :(exclude)tests/ts/publication-safety.test.ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan tracked files
        shell: bash
        run: |
          set +e
          git grep -lIE "$PERSONAL_PATH_RE" -- . $PERSONAL_PATH_EXCLUDE
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then exit 0; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "::error::personal path pattern found in tracked files; scrub it or add a documented exclusion"
          exit 1
